version: "2"
run:
  concurrency: 4
  timeout: 3m
  # The baseline is clean, so lint findings fail the build.
  issues-exit-code: 1
  # Test files are also linted; see the exclusions below for the current scope.
  tests: true

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
  path-prefix: ""

linters:
  enable:
    - staticcheck
    - govet
    - gosec
    - misspell
    - nakedret
    - revive
    - unconvert

  disable:
    - errcheck
    - goconst
    - ineffassign
    - lll
    - unused

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

    rules:
      # We don't control the ciphers as we are just implementing standards.
      - linters:
          - gosec
        text: "weak cryptographic primitive"

    paths:
      - testdata
      - ".*_test.go$"

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
